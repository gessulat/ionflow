# Workspace root only: no package lives here (ionflow decision 0016).

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "ty>=0.0.63",
]

[tool.ty.src]
# Only the shipped library is checked. Tests/examples use the flow DSL, whose
# annotations deliberately mean "output schema", not runtime type (a step
# annotated `-> Summary` returns an arrow table; a `Branch[Part]` param is a
# lazy relation) — a nominal checker rejects that by design.
include = ["packages/ionflow/src"]

# No `[tool.pytest.ini_options]` here: tests run per member (decision 0016),
# with `uv run --directory packages/<name> pytest`.

# Rules span both members and live here; source roots do not — each member
# declares its own `src`, so isort resolves first-party from inside that member.
[tool.ruff]
line-length = 120
# Stated, not inferred: the root has no `[project]` to read `requires-python`
# from, and the default would demote `tomllib` to a third-party import.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
