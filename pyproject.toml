# Workspace root only — no package lives here. `ionflow` and `schrein` are
# siblings under `packages/` (ionflow decision 0016, schrein decision 0005).
# `uv sync` here builds one environment holding both members and every dev
# group; lint and type-check configuration is repo-wide and stays here.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "ty>=0.0.63",
]

[tool.ty.src]
# Only the shipped library is checked. Tests/examples use the flow DSL, whose
# annotations deliberately mean "output schema", not runtime type (a step
# annotated `-> Summary` returns an arrow table; a `Branch[Part]` param is a
# lazy relation) — a nominal checker rejects that by design.
# schrein's src has never been in scope; adding it is its own change, not a
# side effect of the layout.
include = ["packages/ionflow/src"]

# No `[tool.pytest.ini_options]` here, deliberately: each member owns its suite
# (its own conftest, markers and moto harness — the two collide if collected
# together). Run them with `uv run --directory packages/<name> pytest`.

[tool.ruff]
line-length = 120
# Stated, not inferred: the root has no `[project]` to read `requires-python`
# from, and the default would demote `tomllib` to a third-party import.
target-version = "py312"
# ionflow's package roots, so isort keeps classifying `ionflow` and `examples`
# as first-party now that they no longer sit at the repo root. `schrein` stays
# third-party — it is a dependency of ionflow, not part of it.
src = ["packages/ionflow", "packages/ionflow/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"packages/ionflow/src/ionflow/cli.py" = ["B008"]  # typer's Option-in-default idiom
