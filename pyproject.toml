[project]
name = "miniflow"
version = "0.1.0"
description = "A barebones Metaflow alternative: typed table flows on S3, no scheduler."
readme = "README.md"
authors = [
    { name = "Siegfried Gessulat", email = "s.gessulat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.43",
    "duckdb>=1.5.4",
    "pyarrow>=24.0.0",
    "textual>=8.2.8",
    "typer>=0.26.8",
]

[project.scripts]
miniflow = "miniflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3,server]>=5.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
